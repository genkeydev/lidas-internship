[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alertdesk"
version = "1.0.0"
description = "Security alert and ticket intake — Year 2 Cybersecurity Capstone"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27.0"]

[project.scripts]
alertdesk = "alertdesk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alertdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["alertdesk"]
omit = ["tests/*"]

[tool.coverage.report]
# Week 3: uncomment fail_under after the full test suite reaches ≥80%.
# fail_under = 80
show_missing = true
