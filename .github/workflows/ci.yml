name: CI

on:
  push:
    branches: [main, "intern/**"]
  pull_request:
    branches: [main, "intern/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov
      - run: pytest tests/ -v --cov=lidas --cov-fail-under=80

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: "p/python"

  container-scan:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lidas:ci .
      - uses: aquasecurity/trivy-action@v0.19.0
        with:
          image-ref: "lidas:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
